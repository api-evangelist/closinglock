aid: closinglock
name: Closinglock
description: >-
  Closinglock is an Austin, Texas fintech and fraud-prevention company whose platform secures the
  money movement and identity checks inside a residential real estate closing. Title companies,
  real estate attorneys, agents, underwriters and their buyers and sellers use it to share wire
  instructions over an authenticated channel instead of email, verify identity and bank-account
  ownership before funds move, collect and disburse funds through SecurePay digital payments,
  retrieve and verify mortgage payoff statements, manage and e-sign closing documents, run two-way
  text messaging with the parties to a file, and evidence FinCEN and ALTA Best Practices
  obligations. The company announced SOC 2 Type II certification in August 2023 and raised a
  $34M Series B led by Sageview Capital in January 2025. Closinglock ships integrations into the
  major title production systems — SoftPro, RamQuest and ResWare — plus a DocuSign e-signature
  partnership, but those integrations are built bilaterally with each vendor: as of this profile
  Closinglock publishes no public developer portal, API reference, or machine-readable contract.
